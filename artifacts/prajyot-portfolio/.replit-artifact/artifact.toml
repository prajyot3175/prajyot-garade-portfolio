kind = "web"
previewPath = "/"
title = "Prajyot Garade — Portfolio"
description = "A recruiter-focused portfolio for Prajyot Vijay Garade, showcasing software testing, full-stack development, machine learning projects, education, achievements, and contact details."
version = "1.0.0"
id = "artifacts/prajyot-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24724

[services.development]
run = "pnpm --filter @workspace/prajyot-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prajyot-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/prajyot-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24724"
BASE_PATH = "/"
